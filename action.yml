name: update-node-hook
description: Action to automatically update node-based pre-commit hooks.
author: Paul Fischer <paul.fischer@mailbox.org>
inputs:
  pre-commit-autoupdate:
    description: Whether to also update the revisions in the repository's `.pre-commit-config.yaml`.
    default: 'true'
runs:
  using: 'composite'
  steps:
    - uses: actions/checkout@v7
      with:
        # tags are needed to check whether the current version was released
        fetch-depth: 0
    - uses: actions/setup-node@v7
      with:
        node-version: '24'
        registry-url: 'https://registry.npmjs.org'
    - run: npm install -g npm@latest
      shell: bash
    - run: node ${{ github.action_path }}/dist/index.js
      shell: bash
    - if: inputs.pre-commit-autoupdate == 'true'
      run: |
        [ -f .pre-commit-config.yaml ] || exit 0
        git checkout --quiet "${GITHUB_REF_NAME}"
        pipx run pre-commit autoupdate
        git diff --quiet -- .pre-commit-config.yaml && exit 0
        git add .pre-commit-config.yaml
        git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit --quiet --message 'pre-commit autoupdate'
        git push --quiet
      shell: bash
